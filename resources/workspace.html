<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>研发交付工作台</title>
  <link rel="stylesheet" href="/workspace.css">
  <script src="/workspace.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="/">Dev Delivery</a>
    <span id="identity"></span>
    <button id="logout" type="button" hidden>退出</button>
  </header>
  <main>
    <p id="message" role="status" aria-live="polite" hidden></p>
    <section id="authentication">
      <h1>登录研发交付工作台</h1>
      <form id="login">
        <label>租户<input name="tenant" required autocomplete="organization"></label>
        <label>邮箱<input name="email" type="email" required autocomplete="username"></label>
        <label>密码<input name="password" type="password" required autocomplete="current-password"></label>
        <button>登录</button>
      </form>
    </section>
    <div id="workspace" hidden>
      <aside>
        <h2>项目</h2>
        <nav id="projects" aria-label="项目"></nav>
        <button id="more-projects" type="button" hidden>更多项目</button>
        <details id="accounts" hidden>
          <summary>创建成员</summary>
          <form id="create-account">
            <label>姓名<input name="name" required></label>
            <label>邮箱<input name="email" type="email" required></label>
            <label>初始密码<input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
            <label>角色<select name="role">
              <option value="product">产品经理</option>
              <option value="engineer">工程师</option>
              <option value="tester">测试人员</option>
              <option value="release_manager">发布经理</option>
              <option value="business">业务签收人</option>
            </select></label>
            <button>创建</button>
          </form>
          <ul id="account-list"></ul>
          <button id="more-accounts" type="button" hidden>更多成员</button>
        </details>
      </aside>
      <div>
        <details class="panel" id="new-project" hidden>
          <summary>创建项目</summary>
          <form id="create-project">
            <label>项目编码<input name="code" required></label>
            <label>项目名称<input name="title" required></label>
            <label>项目章程<textarea name="charter" required></textarea></label>
            <label>产品负责人账号 ID<input name="product_owner_id" type="number" min="1" required></label>
            <label>业务签收人账号 ID<input name="business_signer_id" type="number" min="1" required></label>
            <button>创建项目</button>
          </form>
        </details>
        <section id="project-detail" hidden>
          <h1 id="project-title"></h1>
          <p id="project-charter"></p>
          <div id="planning" hidden>
            <details class="panel">
              <summary>章程与成员</summary>
              <form id="edit-project">
                <label>项目名称<input name="title" required></label>
                <label>项目章程<textarea name="charter" required></textarea></label>
                <button>保存章程新版本</button>
              </form>
              <form id="project-member">
                <label>成员账号 ID<input name="member_id" type="number" min="1" required></label>
                <label>操作<select name="enabled"><option value="true">加入项目</option><option value="false">移出项目</option></select></label>
                <button>保存成员</button>
              </form>
            </details>
            <details class="panel">
              <summary>添加需求和验收标准</summary>
              <form id="create-requirement">
                <label>需求编码<input name="code" required></label>
                <label>需求名称<input name="title" required></label>
                <label>背景与范围<textarea name="summary" required></textarea></label>
                <button>添加需求</button>
              </form>
              <form id="create-criterion">
                <label>所属需求<select name="requirement" id="requirement-options" required></select></label>
                <label>标准编码<input name="code" required></label>
                <label>标准名称<input name="title" required></label>
                <label>验收条件<textarea name="statement" required></textarea></label>
                <button>添加验收标准</button>
              </form>
            </details>
            <section class="panel">
              <h2>待冻结范围</h2>
              <div id="scope"></div>
              <form id="freeze">
                <label>基线名称<input name="title" required></label>
                <button>冻结基线</button>
              </form>
            </section>
          </div>
          <section class="panel">
            <h2>已冻结基线</h2>
            <div id="baselines"></div>
            <button id="more-baselines" type="button" hidden>更多基线</button>
            <div id="baseline-detail"></div>
          </section>
          <section class="panel">
            <h2>变更评审</h2>
            <details id="change-editor" hidden>
              <summary>发起变更</summary>
              <form id="propose-change">
                <p id="proposal-baseline">请先打开要修订的基线。</p>
                <div id="proposal-criteria"></div>
                <label id="proposal-reason" hidden>变更理由<textarea name="reason" required></textarea></label>
                <button id="add-proposal-criterion" type="button" hidden>添加修订项</button>
                <button id="submit-change" disabled>提交评审</button>
              </form>
            </details>
            <div id="changes" class="item-list"></div>
            <div id="change-detail"></div>
            <form id="review-change" hidden>
              <label>评审结果<select name="decision">
                <option value="approved">批准</option><option value="rejected">驳回</option>
              </select></label>
              <label>评审意见<textarea name="note" required></textarea></label>
              <button>确认评审</button>
            </form>
          </section>
          <section class="panel">
            <h2>迭代与团队依赖</h2>
            <div id="sprints" class="item-list"></div>
            <div id="sprint-detail"></div>
            <details id="sprint-editor" hidden>
              <summary>创建迭代</summary>
              <form id="create-sprint">
                <label>团队编码<input name="team" required></label>
                <label>迭代编码<input name="code" required></label>
                <label>迭代名称<input name="title" required></label>
                <label>开始日期<input name="starts_on" type="date" required></label>
                <label>结束日期<input name="ends_on" type="date" required></label>
                <label>容量（点）<input name="capacity" type="number" min="1" required></label>
                <button>创建迭代</button>
              </form>
            </details>
            <h3>任务</h3>
            <div id="work-items" class="item-list"></div>
            <details id="work-editor" hidden>
              <summary>创建任务</summary>
              <form id="create-work">
                <label>验收标准<select name="criterion_id" required></select></label>
                <label>任务编码<input name="code" required></label>
                <label>任务名称<input name="title" required></label>
                <label>团队编码<input name="team" required></label>
                <label>责任人账号 ID<input name="owner_id" type="number" min="1" required></label>
                <label>工作量（点）<input name="effort" type="number" min="1" required></label>
                <button>创建任务</button>
              </form>
            </details>
            <div id="work-detail"></div>
            <div id="work-actions" hidden>
              <form id="schedule-work">
                <label>迭代 ID（留空取消排期）<input name="sprint_id" type="number" min="1"></label>
                <button>保存排期</button>
              </form>
              <form id="save-dependency">
                <label>前置任务 ID<input name="predecessor_id" type="number" min="1" required></label>
                <label>依赖责任人账号 ID<input name="owner_id" type="number" min="1" required></label>
                <label>依赖截止日期<input name="due_on" type="date" required></label>
                <button>保存依赖</button>
              </form>
            </div>
            <form id="link-git" hidden>
              <label>仓库 ID<input name="repository_id" type="number" min="1" required></label>
              <label>提交快照 ID<input name="snapshot_id" type="number" min="1" required></label>
              <button>关联提交</button>
            </form>
            <div id="git-links" class="item-list"></div>
          </section>
          <section class="panel">
            <h2>代码仓库与构建</h2>
            <div id="repositories" class="item-list"></div>
            <details id="repository-editor" hidden>
              <summary>登记代码仓库</summary>
              <form id="register-repository">
                <label>仓库名称<input name="name" required></label>
                <label>代码托管平台<select name="provider">
                  <option value="github">GitHub</option><option value="gitee">Gitee</option>
                  <option value="gitlab">GitLab</option><option value="manual">离线仓库</option>
                </select></label>
                <label>平台仓库标识<input name="provider_repository_id" required></label>
                <button>登记仓库</button>
              </form>
            </details>
            <div id="repository-detail"></div>
            <div id="snapshot-detail"></div>
            <details id="import-editor" hidden>
              <summary>导入 Git 或构建回执</summary>
              <form id="import-git">
                <label>事件 JSON<textarea name="event" rows="8" required></textarea></label>
                <button>导入回执</button>
              </form>
            </details>
            <div id="repository-events"></div>
          </section>
          <section class="panel">
            <h2>关联测试用例</h2>
            <div id="test-cases" class="item-list"></div>
            <details id="case-editor" hidden>
              <summary>登记验收用例</summary>
              <form id="create-case">
                <label>验收标准<select name="criterion_id" required></select></label>
                <label>用例编码<input name="code" required></label>
                <label>用例名称<input name="title" required></label>
                <label>执行步骤<textarea name="steps" required></textarea></label>
                <label>预期结果<textarea name="expected_result" required></textarea></label>
                <button>登记用例</button>
              </form>
            </details>
          </section>
          <section class="panel">
            <h2>项目时间线</h2>
            <ol id="timeline"></ol>
            <button id="more-events" type="button" hidden>更多事件</button>
          </section>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
